      <div class="brand-avatar"><i class="fas fa-heartbeat"></i></div>
      <h2>AI Blood Demand Forecast System</h2>
    </div>
    <nav class="navigation-matrix">
      <a routerLink="dashboard" routerLinkActive="active-route"><span class="icon">📊</span> Dashboard</a>
